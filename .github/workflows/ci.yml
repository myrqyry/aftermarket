name: Build and test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@5fa9df365362a023a404d5bb4b276e62ec906043
    with:
      module: aftermarket
      profile: full
      driver: caller
      engine-revision: 5fa9df365362a023a404d5bb4b276e62ec906043
      linux-sdk-cache: true
      required-paths: |
        .github/scripts/ci-project.sh
        .github/scripts/verify-linux.sh
        .github/scripts/ci-native.py
        .github/scripts/test-native-caller.py
        .github/scripts/test-readme-links.py
        .github/scripts/check_readme_links.py
        LICENSE
        third_party/libebur128/THIRD_PARTY_NOTICES.txt
      minimum-tests: 49
      source-package: false
      upload-artifacts: true
