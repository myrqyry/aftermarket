name: Build and test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@238f06a01f1469a21fe6991df7f94ef149472be1
    with:
      module: aftermarket
      profile: linux-obs32
      driver: caller
      minimum-tests: 46
      source-package: false
      upload-artifacts: false
