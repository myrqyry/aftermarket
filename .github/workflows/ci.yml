name: Build and test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@73cc0ec83c3182cb471fc977d2de676416194852
    with:
      module: aftermarket
      profile: full
      driver: caller
      engine-revision: 73cc0ec83c3182cb471fc977d2de676416194852
      linux-sdk-cache: true
      required-paths: |
        .github/scripts/ci-project.sh
        .github/scripts/verify-linux.sh
        .github/scripts/ci-native.py
        .github/scripts/test-native-caller.py
        .github/scripts/test-readme-links.py
        .github/scripts/check_readme_links.py
        LICENSE
        third_party/libebur128/THIRD_PARTY_NOTICES.txt
      minimum-tests: 48
      source-package: false
      upload-artifacts: true
